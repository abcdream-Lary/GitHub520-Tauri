<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src * data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src * ipc: http://ipc.localhost https://ipc.localhost"
    />
    <title>GitHub520</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <!-- 默认按「已聚焦」渲染，boot 拿到真实状态后再纠正，避免启动瞬间闪一下失焦样式 -->
  <body class="focused">
    <div class="app" id="app">
      <!-- ══ 自定义标题栏（与应用内部无缝一体） ══ -->
      <header class="titlebar" id="titlebar">
        <div class="tb-left">
          <div class="brand">
            <img class="brand-icon" src="../../resources/icon.png" alt="" draggable="false" />
            <span class="brand-name">GitHub520</span>
            <span class="brand-sub">Hosts 管家</span>
          </div>
          <div class="tb-sep"></div>
          <div class="tb-chip" id="tbPriv" title="写入 hosts 文件所需权限">
            <span class="dot"></span><span class="txt">检测中</span>
          </div>
          <div class="tb-chip" id="tbSync" title="自动同步状态">
            <span class="dot"></span><span class="txt">未同步</span>
          </div>
        </div>
        <div class="tb-drag"></div>
        <div class="tb-right">
          <button class="win-btn" id="btnMin" title="最小化">
            <svg viewBox="0 0 12 12"><path d="M2 6h8" /></svg>
          </button>
          <button class="win-btn" id="btnMax" title="最大化">
            <svg viewBox="0 0 12 12" class="ico-max"><rect x="2.4" y="2.4" width="7.2" height="7.2" rx="1.4" /></svg>
            <svg viewBox="0 0 12 12" class="ico-restore">
              <rect x="2.2" y="4.2" width="5.6" height="5.6" rx="1.2" />
              <path d="M4.4 4.2V3.4A1.2 1.2 0 0 1 5.6 2.2h3.2A1.2 1.2 0 0 1 10 3.4v3.2a1.2 1.2 0 0 1-1.2 1.2h-.8" />
            </svg>
          </button>
          <button class="win-btn close" id="btnClose" title="关闭到托盘">
            <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg>
          </button>
        </div>
      </header>

      <!-- ══ 主体：侧栏 + 内容区 ══ -->
      <div class="shell">
        <aside class="sidebar">
          <nav class="nav" id="nav">
            <button class="nav-item" data-page="hosts">
              <svg viewBox="0 0 20 20" class="ico">
                <path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h8" />
                <circle cx="12.2" cy="14.5" r="1.6" />
              </svg>
              <span>Hosts 管理</span>
              <em class="nav-badge" id="navBadgeDirty"></em>
            </button>
            <button class="nav-item" data-page="speed">
              <svg viewBox="0 0 20 20" class="ico">
                <path d="M10 16.5a6.5 6.5 0 1 1 6.5-6.5" />
                <path d="M10 10l3.6-3.2" />
                <circle cx="10" cy="10" r="1.1" />
              </svg>
              <span>延迟测速</span>
            </button>
            <button class="nav-item" data-page="sync">
              <svg viewBox="0 0 20 20" class="ico">
                <path d="M16.2 8.2A6.4 6.4 0 0 0 5 6.4M3.8 11.8A6.4 6.4 0 0 0 15 13.6" />
                <path d="M16.6 4.6v3.6h-3.6M3.4 15.4v-3.6h3.6" />
              </svg>
              <span>自动同步</span>
              <em class="nav-badge sync-dot" id="navSyncDot"></em>
            </button>
            <button class="nav-item" data-page="settings">
              <svg viewBox="0 0 20 20" class="ico">
                <circle cx="10" cy="10" r="2.6" />
                <path
                  d="M10 2.6v2M10 15.4v2M17.4 10h-2M4.6 10h-2M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4M15.2 15.2l-1.4-1.4M6.2 6.2L4.8 4.8"
                />
              </svg>
              <span>设置</span>
            </button>
          </nav>

          <div class="side-foot">
            <div class="side-stat">
              <div class="side-stat-row"
                ><span>生效条目</span><strong id="sideEnabled">–</strong></div
              >
              <div class="side-stat-row"><span>总条目</span><strong id="sideTotal">–</strong></div>
            </div>
            <div class="side-ver" id="sideVer">v1.0.0</div>
          </div>
        </aside>

        <main class="view" id="view">
          <div class="view-scroll" id="viewScroll"></div>
        </main>
      </div>
    </div>

    <!-- 模态框 -->
    <div class="modal-root" id="modalRoot" hidden>
      <div class="modal-mask" data-close="1"></div>
      <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
    </div>

    <!-- 提示 -->
    <div class="toasts" id="toasts"></div>

    <!-- Tauri 桥接：提供与 Electron 版完全一致的 window.api（须先于 app.js 加载） -->
    <script src="tauri-api.js"></script>
    <script src="app.js"></script>
    <script src="selftest.js"></script>
  </body>
</html>
